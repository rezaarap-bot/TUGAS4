<!DOCTYPE html>
<html>
<body>
<h2>Aplikasi Kasir Elektronik (Menggunakan Fungsi)</h2>
<script>
    function hitungDiskon(totalBelanja) {
        let persen = 0;
        if (totalBelanja >= 200000) {
            persen = 20;
        } else if (totalBelanja >= 100000) {
            persen = 10;
        }
        return (persen / 100) * totalBelanja;
    }

    let pembeli = prompt("Masukkan Nama Pembeli:");
    let barang1 = prompt("Masukkan Nama Barang 1:");
    let harga1 = Number(prompt("Masukkan Harga Barang 1 (Rp):"));

    let barang2 = prompt("Masukkan Nama Barang 2:");
    let harga2 = Number(prompt("Masukkan Harga Barang 2 (Rp):"));

    let totalBelanja = harga1 + harga2;
    let nominalDiskon = hitungDiskon(totalBelanja); 
    let totalBayar = totalBelanja - nominalDiskon;

    for (let i = 1; i <= 35; i++) { document.write("="); }
    document.write("<br><b>STRUK TOKO ELEKTRONIK RPL</b><br>");
    for (let i = 1; i <= 35; i++) { document.write("="); }
    document.write("<br>");

    document.write("Nama Pembeli : " + pembeli + "<br>");
    document.write("1. " + barang1 + " : Rp " + harga1 + "<br>");
    document.write("2. " + barang2 + " : Rp " + harga2 + "<br>");

    for (let i = 1; i <= 35; i++) { document.write("-"); }
    document.write("<br>");

    document.write("Total Belanja : Rp " + totalBelanja + "<br>");
    document.write("Potongan Diskon: Rp " + nominalDiskon + "<br>");
    document.write("<b>Total Bayar : Rp " + totalBayar + "</b><br>");

    for (let i = 1; i <= 35; i++) { document.write("="); }
</script>
</body>
</html>
